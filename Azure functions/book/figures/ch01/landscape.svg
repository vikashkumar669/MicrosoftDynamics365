<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" width="640" height="490" font-family="Inter, Arial, sans-serif" role="img" aria-label="Harbourline Connect sits between Dataverse and five external systems and teams">
  <title>Harbourline's integration landscape (fictional)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4A5568"/>
    </marker>
  </defs>

  <!-- Power Platform -->
  <rect x="10" y="60" width="214" height="360" rx="8" fill="#F5F9FD" stroke="#0F6CBD" stroke-width="1.2"/>
  <text x="24" y="84" font-size="12.5" font-weight="600" fill="#0F6CBD">Microsoft Power Platform</text>
  <g font-size="11" fill="#0B1F3A" text-anchor="middle">
    <rect x="22" y="98" width="190" height="28" rx="5" fill="#FFFFFF" stroke="#0B1F3A"/>
    <text x="117" y="116">Dynamics 365 Sales</text>
    <rect x="22" y="134" width="190" height="28" rx="5" fill="#FFFFFF" stroke="#0B1F3A"/>
    <text x="117" y="152">Dynamics 365 Customer Service</text>
    <rect x="22" y="170" width="190" height="28" rx="5" fill="#FFFFFF" stroke="#0B1F3A"/>
    <text x="117" y="188">Power Apps and Power Pages</text>
  </g>
  <path d="M22 228V384A88 14 0 0 0 198 384V228" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.2"/>
  <ellipse cx="110" cy="228" rx="88" ry="14" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.2"/>
  <text x="110" y="292" font-size="15" font-weight="700" text-anchor="middle" fill="#0B1F3A">Dataverse</text>
  <g font-size="11" text-anchor="middle" fill="#4A5568">
    <text x="110" y="314">accounts · contacts</text>
    <text x="110" y="330">properties · leases</text>
    <text x="110" y="346">products · orders</text>
  </g>

  <!-- Dataverse <-> Connect -->
  <path d="M224 214H244" fill="none" stroke="#4A5568" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M248 266H228" fill="none" stroke="#4A5568" stroke-width="1.6" marker-end="url(#a)"/>
    
  <!-- Connect hub -->
  <rect x="248" y="170" width="120" height="130" rx="8" fill="#0B1F3A"/>
  <text x="308" y="214" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">Harbourline</text>
  <text x="308" y="232" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">Connect</text>
  <text x="308" y="256" font-size="11.5" text-anchor="middle" fill="#C9D6E8">Azure Functions</text>
  <text x="308" y="274" font-size="11" text-anchor="middle" fill="#9CCBFA">built in this book</text>

  <!-- Fan-out -->
  <g fill="none" stroke="#4A5568" stroke-width="1.4">
    <path d="M368 190C394 190 392 56 412 56" marker-end="url(#a)"/>
    <path d="M368 210C394 210 392 142 412 142" marker-end="url(#a)"/>
    <path d="M368 235C394 235 392 228 412 228" marker-end="url(#a)"/>
    <path d="M368 260C394 260 392 314 412 314" marker-end="url(#a)"/>
    <path d="M368 280C394 280 392 400 412 400" marker-end="url(#a)"/>
  </g>

  <!-- External systems -->
  <g fill="#0B1F3A">
    <rect x="416" y="30" width="214" height="52" rx="6" fill="#E8F2FB" stroke="#0F6CBD"/>
    <text x="430" y="52" font-size="12.5" font-weight="600">LedgerOne ERP</text>
    <text x="430" y="70" font-size="11" fill="#4A5568">customers, orders, invoices</text>

    <rect x="416" y="116" width="214" height="52" rx="6" fill="#E8F2FB" stroke="#0F6CBD"/>
    <text x="430" y="138" font-size="12.5" font-weight="600">SignBridge e-signature</text>
    <text x="430" y="156" font-size="11" fill="#4A5568">lease and contract signing</text>

    <rect x="416" y="202" width="214" height="52" rx="6" fill="#E8F2FB" stroke="#0F6CBD"/>
    <text x="430" y="224" font-size="12.5" font-weight="600">Property data feed</text>
    <text x="430" y="242" font-size="11" fill="#4A5568">nightly CSV, JSON, XML files</text>

    <rect x="416" y="288" width="214" height="52" rx="6" fill="#E8F2FB" stroke="#0F6CBD"/>
    <text x="430" y="310" font-size="12.5" font-weight="600">Tenant portal, partners</text>
    <text x="430" y="328" font-size="11" fill="#4A5568">secure integration API</text>

    <rect x="416" y="374" width="214" height="52" rx="6" fill="#E8F2FB" stroke="#0F6CBD"/>
    <text x="430" y="396" font-size="12.5" font-weight="600">Finance team</text>
    <text x="430" y="414" font-size="11" fill="#4A5568">Excel exports and imports</text>
  </g>

  <text x="10" y="470" font-size="11" fill="#4A5568">All company and system names are fictional.</text>
</svg>
