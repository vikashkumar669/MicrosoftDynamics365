<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="Inter, Arial, sans-serif" role="img" aria-label="Four questions decide between a plug-in, a data link, Power Automate, Logic Apps and Azure Functions">
  <title>Choosing where integration logic belongs</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4A5568"/>
    </marker>
  </defs>

  <!-- Questions -->
  <g fill="#0B1F3A">
    <rect x="10" y="10" width="370" height="62" rx="31" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.2"/>
    <text x="34" y="37" font-size="12.5" font-weight="600">1  Must it block or roll back the save?</text>
    <text x="34" y="56" font-size="11" fill="#4A5568">validation, values set before commit</text>

    <rect x="10" y="112" width="370" height="62" rx="31" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.2"/>
    <text x="34" y="139" font-size="12.5" font-weight="600">2  Is it a copy of data for analytics?</text>
    <text x="34" y="158" font-size="11" fill="#4A5568">dashboards, data warehouse, reporting</text>

    <rect x="10" y="214" width="370" height="62" rx="31" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.2"/>
    <text x="34" y="241" font-size="12.5" font-weight="600">3  Will business users build and change it?</text>
    <text x="34" y="260" font-size="11" fill="#4A5568">approvals, notifications, standard connectors</text>

    <rect x="10" y="316" width="370" height="62" rx="31" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.2"/>
    <text x="34" y="343" font-size="12.5" font-weight="600">4  Is it an IT workflow over many connectors?</text>
    <text x="34" y="362" font-size="11" fill="#4A5568">B2B, enterprise SaaS, visual orchestration</text>
  </g>

  <g fill="none" stroke="#4A5568" stroke-width="1.5">
    <path d="M380 41H426" marker-end="url(#a)"/>
    <path d="M380 143H426" marker-end="url(#a)"/>
    <path d="M380 245H426" marker-end="url(#a)"/>
    <path d="M380 347H426" marker-end="url(#a)"/>
    <path d="M195 72V108" marker-end="url(#a)"/>
    <path d="M195 174V210" marker-end="url(#a)"/>
    <path d="M195 276V312" marker-end="url(#a)"/>
    <path d="M195 378V416" marker-end="url(#a)"/>
  </g>
  <g font-size="11" fill="#4A5568">
    <text x="403" y="34" text-anchor="middle">yes</text>
    <text x="403" y="136" text-anchor="middle">yes</text>
    <text x="403" y="238" text-anchor="middle">yes</text>
    <text x="403" y="340" text-anchor="middle">yes</text>
    <text x="205" y="95">no</text>
    <text x="205" y="197">no</text>
    <text x="205" y="299">no</text>
    <text x="205" y="401">no</text>
  </g>

  <!-- Outcomes -->
  <g fill="#0B1F3A">
    <rect x="430" y="14" width="200" height="54" rx="6" fill="#E8F2FB" stroke="#0F6CBD"/>
    <text x="444" y="37" font-size="12.5" font-weight="600">Synchronous plug-in</text>
    <text x="444" y="55" font-size="11" fill="#4A5568">keep it thin</text>

    <rect x="430" y="116" width="200" height="54" rx="6" fill="#E8F2FB" stroke="#0F6CBD"/>
    <text x="444" y="139" font-size="12.5" font-weight="600">Fabric or Synapse Link</text>
    <text x="444" y="157" font-size="11" fill="#4A5568">no integration code</text>

    <rect x="430" y="218" width="200" height="54" rx="6" fill="#E8F2FB" stroke="#0F6CBD"/>
    <text x="444" y="241" font-size="12.5" font-weight="600">Power Automate</text>
    <text x="444" y="259" font-size="11" fill="#4A5568">can still call a function</text>

    <rect x="430" y="320" width="200" height="54" rx="6" fill="#E8F2FB" stroke="#0F6CBD"/>
    <text x="444" y="343" font-size="12.5" font-weight="600">Azure Logic Apps</text>
    <text x="444" y="361" font-size="11" fill="#4A5568">can still call a function</text>
  </g>

  <rect x="10" y="420" width="620" height="88" rx="8" fill="#0B1F3A"/>
  <text x="30" y="450" font-size="14" font-weight="700" fill="#FFFFFF">Azure Functions</text>
  <text x="30" y="472" font-size="11.5" fill="#C9D6E8">custom code and APIs, heavy or high-volume processing,</text>
  <text x="30" y="490" font-size="11.5" fill="#C9D6E8">scheduled jobs, files, long-running orchestration</text>
</svg>
