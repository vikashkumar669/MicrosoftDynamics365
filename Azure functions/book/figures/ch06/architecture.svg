  <g fill="none" stroke="#4A5568" stroke-width="1.6">
    <path d="M190 58V152" marker-end="url(#a)"/>
    <path d="M230 168H290V58H416" marker-end="url(#a)"/>
    <path d="M416 80H302V182H234" marker-end="url(#a)"/>
    <path d="M230 236H406" marker-end="url(#a)"/>
    <path d="M135 266V336" marker-end="url(#a)"/>
  </g>
  <path d="M410 262H236" fill="none" stroke="#9A5100" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#b)"/>

  <!-- Edge labels -->
  <text x="182" y="86" font-size="11.5" text-anchor="end" fill="#0B1F3A">HTTPS + function key</text>
  <rect x="306" y="36" width="104" height="16" fill="#FFFFFF"/>
  <text x="358" y="48" font-size="11" text-anchor="middle" fill="#0B1F3A">① request token</text>
  <rect x="312" y="86" width="100" height="16" fill="#FFFFFF"/>
  <text x="362" y="98" font-size="11" text-anchor="middle" fill="#0B1F3A">② access token</text>
  <rect x="270" y="199" width="96" height="31" fill="#FFFFFF"/>
  <text x="318" y="211" font-size="11" text-anchor="middle" fill="#0B1F3A">③ SDK call as</text>
  <text x="318" y="226" font-size="11" text-anchor="middle" fill="#0B1F3A">application user</text>
  <rect x="262" y="268" width="112" height="16" fill="#FFFFFF"/>
  <text x="318" y="280" font-size="11.5" font-weight="600" text-anchor="middle" fill="#9A5100">429 + Retry-After</text>
