<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="Inter, Arial, sans-serif" role="img" aria-label="The Function App gets tokens for its managed identity from Microsoft Entra ID and calls Dataverse as an application user">
  <title>Chapter 6 architecture: secret-free access from Azure Functions to Dataverse</title>
