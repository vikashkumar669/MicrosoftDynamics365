<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Inter, Arial, sans-serif" role="img" aria-label="The orchestration sends the envelope, then waits for SignBridge's callback or a reminder timer, for up to nine days, without running any code while it waits"><title>The orchestration sends the envelope, then waits for SignBridge's callback or a reminder timer, for up to nine days, without running any code while it waits</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5568"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9A5100"/></marker></defs><rect x="10" y="20" width="150" height="56" rx="6" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.2"/><image x="20" y="34.0" width="28" height="28" href="data:image/svg+xml;base64,"/><text x="58.0" y="44.2" font-size="12.5" font-weight="600" fill="#0B1F3A" text-anchor="start">lease-signing</text><text x="58.0" y="59.2" font-size="11" font-weight="400" fill="#4A5568" text-anchor="start">queue (Ch. 9)</text><rect x="10" y="110" width="150" height="56" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="85.0" y="134.2" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Client function</text><text x="85.0" y="149.2" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">StartLeaseSigning</text><path d="M85 76 L85 106" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="10" width="280" height="310" rx="8" fill="#F5F9FD" stroke="#0F6CBD" stroke-width="1.2"/><text x="204.0" y="32.0" font-size="12.5" font-weight="600" fill="#0F6CBD" text-anchor="start">LeaseSigningOrchestration</text><rect x="210" y="50" width="240" height="50" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="330.0" y="71.2" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">SendEnvelope</text><text x="330.0" y="86.2" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">activity, retried</text><rect x="210" y="130" width="240" height="64" rx="6" fill="#0F6CBD" stroke="#0F6CBD" stroke-width="1.2"/><text x="330.0" y="150.8" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Wait for first of:</text><text x="330.0" y="165.8" font-size="11" font-weight="400" fill="#E8F2FB" text-anchor="middle">SignatureCompleted event</text><text x="330.0" y="180.8" font-size="11" font-weight="400" fill="#E8F2FB" text-anchor="middle">timer (3 days)</text><rect x="210" y="230" width="110" height="60" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="265.0" y="248.8" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Signed?</text><text x="265.0" y="263.8" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">Active /</text><text x="265.0" y="278.8" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">Declined</text><rect x="340" y="230" width="110" height="60" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="395.0" y="248.8" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Timer</text><text x="395.0" y="263.8" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">remind, or</text><text x="395.0" y="278.8" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">expire</text><path d="M160 138 L185 138 L185 75 L206 75" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)"/><rect x="158.3" y="139.0" width="53.3" height="15.0" fill="#FFFFFF"/><text x="185.0" y="150.0" font-size="11" font-weight="400" fill="#0B1F3A" text-anchor="middle">schedule</text><path d="M330 100 L330 126" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)"/><path d="M290 194 L265 226" fill="n