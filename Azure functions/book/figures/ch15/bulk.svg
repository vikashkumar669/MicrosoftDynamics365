<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Inter, Arial, sans-serif" role="img" aria-label="100,000 rows become 500 requests of 200 rows, sent a few at a time; a failed batch is split until the bad rows are found"><title>100,000 rows become 500 requests of 200 rows, sent a few at a time; a failed batch is split until the bad rows are found</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5568"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9A5100"/></marker></defs><rect x="10" y="110" width="120" height="70" rx="6" fill="#E8F2FB" stroke="#0F6CBD" stroke-width="1.2"/><text x="70.0" y="141.2" font-size="12.5" font-weight="600" fill="#0B1F3A" text-anchor="middle">100,000</text><text x="70.0" y="156.2" font-size="11" font-weight="400" fill="#4A5568" text-anchor="middle">rows (CSV)</text><rect x="160" y="20" width="170" height="56" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="245.0" y="44.2" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Batch 1</text><text x="245.0" y="59.2" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">200 rows</text><rect x="160" y="90" width="170" height="56" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="245.0" y="114.2" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Batch 2</text><text x="245.0" y="129.2" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">200 rows</text><rect x="160" y="160" width="170" height="56" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="245.0" y="184.2" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Batch …</text><text x="245.0" y="199.2" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">parallelism = 4</text><rect x="160" y="230" width="170" height="56" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="245.0" y="254.2" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Batch 500</text><text x="245.0" y="269.2" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">200 rows</text><path d="M130 145 L145 145 L145 48 L156 48" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)"/><path d="M130 145 L145 145 L145 118 L156 118" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)"/><path d="M130 145 L145 145 L145 188 L156 188" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)"/><path d="M130 145 L145 145 L145 258 L156 258" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)"/><rect x="370" y="10" width="260" height="200" rx="8" fill="#F5F9FD" stroke="#0F6CBD" stroke-width="1.2"/><text x="384.0" y="32.0" font-size="12.5" font-weight="600" fill="#0F6CBD" text-anchor="start">Dataverse defaults, per user, 5 min</text><rect x="385" y="50" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.2"/><text x="500.0" y="73.6" font-size="12" font-weight="600" fill="#0B1F3A" text-anchor="middle">≤ 6,000 requests</text><rect x="385" y="100" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.2"/><text x="500.0" y="123.6" font-size="12" font-weight="600" fill="#0B1F3A" text-anchor="middle">≤ 20 min execution time</text><rect x="385" y="150" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.2"/><text x="500.0" y="173.6" font-size="12" font-weight="600" fill="#0B1F3A" text-anchor="middle">≤ 52 concurrent requests</text><path d="M330 118 L366 118" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)"/><text x="348.0" y="140.0" font-size="11" font-weight="600" fill="#0B1F3A" text-anchor="middle">Upsert</text><text x="348.0" y="154.0" font-size="11" font-weight="600" fill="#0B1F3A" text-anchor="middle">Multiple</text><rect x="385" y="230" width="230" height="56" rx="6" fill="#FFF4E0" stroke="#9A5100" stroke-width="1.2"/><text x="500.0" y="246.8" font-size="12.5" font-weight="600" fill="#0B1F3A" text-anchor="middle">Batch fails?</text><text x="500.0" y="261.8" font-size="11" font-weight="400" fill="#4A5568" text-anchor="middle">split in half, retry,</text><text x="500.0" y="276.8" font-size="11" font-weight="400" fill="#4A5568" text-anchor="middle">report single bad rows</text><path d="M500 210 L500 226" fill="none" stroke="#9A5100" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#b)"/></svg>
