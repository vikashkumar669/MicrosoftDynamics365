<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Inter, Arial, sans-serif" role="img" aria-label="The SDK for .NET and the Web API are two doors into the same Dataverse services"><title>The SDK for .NET and the Web API are two doors into the same Dataverse services</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5568"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9A5100"/></marker></defs><rect x="10" y="40" width="190" height="64" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="105.0" y="68.2" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">QueryExpression</text><text x="105.0" y="83.2" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">typed C# objects</text><rect x="10" y="124" width="190" height="64" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="105.0" y="152.2" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">FetchXML</text><text x="105.0" y="167.2" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">XML query string</text><rect x="10" y="208" width="190" height="64" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="105.0" y="236.2" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">OData query</text><text x="105.0" y="251.2" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">$select, $filter …</text><rect x="240" y="70" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.2"/><text x="325.0" y="103.8" font-size="12.5" font-weight="600" fill="#0B1F3A" text-anchor="middle">ServiceClient</text><text x="325.0" y="118.8" font-size="11" font-weight="400" fill="#4A5568" text-anchor="middle">SDK fo