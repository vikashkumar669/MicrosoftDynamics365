<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Inter, Arial, sans-serif" role="img" aria-label="Dataverse publishes each account change once; every subscription gets its own copy, and messages that keep failing move to that subscription's dead-letter queue"><title>Dataverse publishes each account change once; every subscription gets its own copy, and messages that keep failing move to that subscription's dead-letter queue</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5568"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9A5100"/></marker></defs><rect x="10" y="110" width="120" height="70" rx="6" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.2"/><image x="20" y="131.0" width="28" height="28" href="data:image/svg+xml;base64,"/><text x="58.0" y="133.8" font-size="12.5" font-weight="600" fill="#0B1F3A" text-anchor="start">Dataverse</text><text x="58.0" y="148.8" font-size="11" font-weight="400" fill="#4A5568" text-anchor="start">account</text><text x="58.0" y="163.8" font-size="11" font-weight="400" fill="#4A5568" text-anchor="start">changes</text><rect x="160" y="20" width="250" height="250" rx="8" fill="#F5F9FD" stroke="#0F6CBD" stroke-width="1.2"/><text x="174.0" y="42.0" font-size="12.5" font-weight="600" fill="#0F6CBD" text-anchor="start">Service Bus topic: account-events</text><rect x="180" y="70" width="210" height="56" rx="6" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.2"/><image x="190" y="84.0" width="28" height="28" href="data:image/svg+xml;base64,"/><text x="228.0" y="94.2" font-size="12.5" font-weight="600" fill="#0B1F3A" text-anchor="start">Subscription</text><text x="228.0" y="109.2" font-size="11" font-weight="400" fill="#4A5568" text-anchor="start">ledgerone</text><rect x="1