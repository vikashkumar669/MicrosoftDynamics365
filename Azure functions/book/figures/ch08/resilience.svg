<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Inter, Arial, sans-serif" role="img" aria-label="A request passes through nested resilience strategies before it reaches LedgerOne; each one handles a different kind of failure"><title>A request passes through nested resilience strategies before it reaches LedgerOne; each one handles a different kind of failure</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5568"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9A5100"/></marker></defs><rect x="10" y="120" width="100" height="60" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="60.0" y="146.2" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">LedgerOne</text><text x="60.0" y="161.2" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">Client</text><rect x="130" y="20" width="380" height="260" rx="8" fill="#F5F9FD" stroke="#0F6CBD" stroke-width="1.2"/><text x="144.0" y="42.0" font-size="12.5" font-weight="600" fill="#0F6CBD" text-anchor="start">Total timeout · 45 s</text><rect x="150" y="50" width="340" height="210" rx="8" fill="#F5F9FD" stroke="#0F6CBD" stroke-width="1.2"/><text x="164.0" y="72.0" font-size="12.5" font-weight="600" fill="#0F6CBD" text-anchor="start">Retry · 3 times, backoff + jitter</text><rect x="170" y="80" width="300" height="160" rx="8" fill="#F5F9FD" stroke="#0F6CBD" stroke-width="1.2"/><text x="184.0" y="102.0" font-size="12.5" font-weight="600" fill="#0F6CBD" text-anchor="start">Circuit breaker · opens on failures</text><rect x="190" y="110" width="260" height="110" rx="8" fill="#F5F9FD" stroke="#0F6CBD" stroke-width="1.2"/><text x="204.0" y="132.0" font-size="12.5" font-weight="600" fill="#0F6CBD" text-anchor="start">At