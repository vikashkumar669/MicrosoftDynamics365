<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Inter, Arial, sans-serif" role="img" aria-label="Each run reads from the last saved watermark minus a five-minute overlap, and saves a new watermark only when every row succeeded"><title>Each run reads from the last saved watermark minus a five-minute overlap, and saves a new watermark only when every row succeeded</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5568"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9A5100"/></marker></defs><path d="M20 120H620" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)"/><text x="620.0" y="106.0" font-size="11" font-weight="400" fill="#4A5568" text-anchor="end">time (UTC)</text><path d="M120 112V128" stroke="#0B1F3A" stroke-width="2"/><text x="120.0" y="146.0" font-size="11" font-weight="600" fill="#0B1F3A" text-anchor="middle">Mon 02:00</text><path d="M330 112V128" stroke="#0B1F3A" stroke-width="2"/><text x="330.0" y="146.0" font-size="11" font-weight="600" fill="#0B1F3A" text-anchor="middle">Tue 02:00</text><path d="M540 112V128" stroke="#0B1F3A" stroke-width="2"/><text x="540.0" y="146.0" font-size="11" font-weight="600" fill="#0B1F3A" text-anchor="middle">Wed 02:00</text><rect x="96" y="70" width="234" height="30" rx="4" fill="#E8F2FB" stroke="#0F6CBD"/><text x="213.0" y="90.0" font-size="11" font-weight="600" fill="#0B1F3A" text-anchor="middle">Tue run reads this window</text><rect x="96" y="104" width="24" height="12" fill="#FFE2B8"/><text x="60.0" y="60.0" font-size="11" font-weight="600" fill="#9A5100" text-anchor="start">5 min overlap</text><path d="M100 64 L106 102" fill="none" stroke="#9A5100" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#b)"/><rect x="150" y="190" width="170" height="56" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="235.0" y="214.2" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Every row ok</text><text x="235.0" y="229.2" font-size="11" font-weight="400" fill="#C9D6E8" text-anchor="middle">save new watermark</text><rect x="350" y="190" width="190" height="56" rx="6" fill="#FFF4E0" stroke="#9A5100" stroke-width="1.2"/><text x="445.0" y="206.8" font-size="12.5" font-weight="600" fill="#0B1F3A" text-anchor="middle">Any row failed</text><text x="445.0" y="221.8" font-size="11" font-weight="400" fill="#4A5568" text-anchor="middle">keep old watermark;</text><text x="445.0" y="236.8" font-size="11" font-weight="400" fill="#4A5568" text-anchor="middle">next run retries</text><path d="M330 154 L330 170 L235 170 L235 186" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)"/><path d="M330 170 L445 170 L445 186" fill="none" stroke="#9A5100" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#b)"/></svg>
