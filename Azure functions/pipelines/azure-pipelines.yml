# Azure DevOps alternative to the GitHub Actions workflows (Chapter 20).
# Service connection: workload identity federation (no secret).
trigger:
  branches: { include: [main] }
  paths: { include: ['Azure functions/*'] }

variables:
  workDir: 'Azure functions'
  azureServiceConnection: 'harbourline-dev-wif'   # create in Project settings

stages:
  - stage: Build
    jobs:
      - job: build
        pool: { vmImage: ubuntu-24.04 }
        steps:
          - task: UseDotNet@2
            inputs:
              useGlobalJson: true
              workingDirectory: $(workDir)
          - script: dotnet build HarbourlineConnect.slnx -c Release
            workingDirectory: $(workDir)
            displayName: Build
          - script: dotnet test --solution HarbourlineConnect.slnx -c Release --no-build
            workingDirectory: $(workDir)
            displayName: Test
          - script: dotnet publish src/Harbourline.Connect.Functions -c Release -o $(Build.ArtifactStagingDirectory)/app
            workingDirectory: $(workDir)
            displayName: Publish
          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/app
              includeRootFolder: false
              archiveFile: $(Build.ArtifactStagingDirectory)/functions.zip
          - publish: $(Build.ArtifactStagingDirectory)/functions.zip
            artifact: functions

  - stage: Dev
    dependsOn: Build
    jobs:
      - deployment: deploy
        environment: harbourline-dev       # add approvals/checks here
        pool: { vmImage: ubuntu-24.04 }
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureFunctionApp@2
                  inputs:
                    connectedServiceNameARM: $(azureServiceConnection)
                    appType: functionAppLinux
                    isFlexConsumption: true
                    appName: $(functionAppName)
                    package: $(Pipeline.Workspace)/functions/functions.zip
